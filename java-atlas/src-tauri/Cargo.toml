[package]
name = "java-atlas"
description = "A read-only atlas of the dependencies inside Java projects."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets on Windows.
name = "java_atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
java-atlas-core.workspace = true
java-atlas-scan.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
