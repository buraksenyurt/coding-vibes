[workspace]
resolver = "3"
members = ["crates/java-atlas-core", "crates/java-atlas-scan", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Burak Selim Senyurt"]

[workspace.dependencies]
java-atlas-core = { path = "crates/java-atlas-core" }
java-atlas-scan = { path = "crates/java-atlas-scan" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tree-sitter = "0.27"
tree-sitter-java = "0.23"

# Dependencies are compiled with light optimisation even in debug builds.
# Parsing thousands of Java files with an unoptimised tree-sitter feels sluggish.
[profile.dev.package."*"]
opt-level = 1
